
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Ajoks PayHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #080810;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #151521;
      border: 1px solid #38304e;
      border-radius: 18px;
    }
    h1 { color: #b99aff; margin-bottom: 8px; }
    .sub { color: #aaa7b8; margin-bottom: 24px; }
    label { display: block; margin: 15px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #494458;
      background: #0c0c15;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #9865ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { margin-top: 16px; line-height: 1.5; overflow-wrap: anywhere; }
    a { color: #c5a8ff; }
    .foot { text-align: center; margin-top: 20px; color: #aaa7b8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ajoks PayHub</h1>
    <p class="sub">Create your account to get started.</p>

    <form id="signupForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username"
             required minlength="3" maxlength="30">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword"
             type="password" autocomplete="new-password" required>

      <button id="signupButton" type="submit">Create Account</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="foot">
      Already registered? <a href="login.html">Log in</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase frontend configuration
    const SUPABASE_URL =
      "https://rsrpxgmpcypyybzdidbj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_5RNJKNpdSEVibrtyrTwK0A_k3Zfid3O";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        if (!window.supabase) {
          throw new Error("The signup library could not load. Check your internet connection and try again.");
        }

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const username =
          document.getElementById("username").value.trim();
        const email =
          document.getElementById("email").value.trim();
        const password =
          document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (username.length < 3) {
          throw new Error("Username must be at least 3 characters.");
        }

        if (password.length < 8) {
          throw new Error("Password must be at least 8 characters.");
        }

        if (password !== confirmPassword) {
          throw new Error("Your passwords do not match.");
        }

        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { username: username },
            emailRedirectTo:
              "https://ajoks-payhub.pages.dev/login.html"
          }
        });

        if (error) throw error;

        if (data.user && data.user.identities &&
            data.user.identities.length === 0) {
          message.textContent =
            "An account may already exist with this email. Try logging in or resetting your password.";
          return;
        }

        if (data.session) {
          message.textContent =
            "Account created successfully! You can now log in.";
        } else {
          message.textContent =
            "Signup received! Check your email for the confirmation link before logging in.";
        }

        form.reset();

      } catch (error) {
        console.error("Signup error:", error);
        message.textContent =
          "Signup failed: " + (error.message || "Please try again.");
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
