
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | Ajoks PayHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090f;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border: 1px solid #393047;
      border-radius: 18px;
      background: #15121e;
    }
    .brand {
      color: #c4b5fd;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle {
      text-align: center;
      color: #aaa3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      color: #ddd6e8;
    }
    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #484054;
      border-radius: 9px;
      background: #0c0a12;
      color: white;
      font-size: 16px;
    }
    input:focus { outline: 1px solid #a78bfa; }
    button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }
    .bottom {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #aaa3b8;
    }
    a { color: #c4b5fd; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">AJOKS PAYHUB</div>
    <h1>Create Account</h1>
    <p class="subtitle">Register to get started.</p>

    <form id="signupForm">
      <label for="username">Username</label>
      <input id="username" name="username"
        type="text" minlength="3" maxlength="20"
        pattern="[A-Za-z0-9_]+"
        placeholder="Choose a username"
        autocomplete="username" required>

      <label for="email">Email Address</label>
      <input id="email" name="email" type="email"
        placeholder="Enter your email"
        autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password"
        type="password" minlength="8"
        placeholder="Create a password"
        autocomplete="new-password" required>

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword"
        type="password" minlength="8"
        placeholder="Enter password again"
        autocomplete="new-password" required>

      <button id="signupButton" type="submit">
        Create Account
      </button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="bottom">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Put your values in the TWO lines below only.
    const SUPABASE_URL = "https://rsrpxgmpcypyybzdidbj.supabase.co/rest/v1/";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5RNJKNpdSEVibrtyrTwK0A_k3Zfid3O";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.textContent = text;
      message.style.color = success ? "#86efac" : "#fca5a5";
      message.style.background = success ? "#12301f" : "#35151c";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        showMessage("Use 3–20 letters, numbers, or underscores for your username.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      if (
        !/^https:\/\/[a-zA-Z0-9-]+\.supabase\.co\/?$/.test(SUPABASE_URL) ||
        SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE" ||
        !SUPABASE_PUBLISHABLE_KEY.trim()
      ) {
        showMessage("Please enter your correct Supabase Project URL and publishable key in the code.");
        return;
      }

      if (!window.supabase) {
        showMessage("Supabase could not load. Check your internet connection and try again.");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL.replace(/\/$/, ""),
          SUPABASE_PUBLISHABLE_KEY.trim()
        );

        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            data: { username },
            emailRedirectTo: "https://ajoks-payhub.pages.dev/login.html"
          }
        });

        if (error) throw error;

        if (data.session) {
          showMessage("Account created! Opening dashboard...", true);
          window.location.href = "dashboard.html";
        } else {
          showMessage(
            "Registration submitted. Check your email for a confirmation link before logging in.",
            true
          );
        }
      } catch (error) {
        console.error("Signup error:", error);
        showMessage("Signup failed: " + (error.message || "Please try again."));
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
