
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Ajoks PayHub</title>

  <style>
    :root {
      --purple: #8b5cf6;
      --black: #09090f;
      --silver: #d1d5db;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #251449, transparent 50%),
        var(--black);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 23px;
      border: 1px solid #373044;
      border-radius: 20px;
      background: rgba(18, 17, 27, 0.97);
      box-shadow: 0 15px 50px #0008;
    }

    .brand {
      margin-bottom: 25px;
      color: var(--silver);
      font-size: 23px;
      font-weight: bold;
      text-align: center;
    }

    .brand span {
      color: var(--purple);
    }

    h1 {
      margin-bottom: 8px;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: var(--silver);
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #454052;
      border-radius: 10px;
      outline: none;
      background: #0c0b12;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 2px #8b5cf633;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: var(--purple);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .login-link {
      margin-top: 22px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    a {
      color: #b69aff;
      text-decoration: none;
    }

    .footer {
      margin-top: 25px;
      color: #77717f;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">AJOKS <span>PAYHUB</span></div>

    <h1>Create Account</h1>
    <p class="subtitle">Create your account to get started.</p>

    <form id="signupForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Choose a username"
        minlength="3"
        maxlength="20"
        pattern="[A-Za-z0-9_]+"
        autocomplete="username"
        required
      >

      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Create a password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        placeholder="Enter your password again"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="signupButton" type="submit">
        Create Account
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Log in</a>
    </p>

    <div class="footer">
      Ajoks PayHub · Your payments, made simple.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // STEP 1: Insert your real Supabase project URL.
    const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";

    // STEP 2: Insert your Supabase publishable key.
    const SUPABASE_PUBLISHABLE_KEY =
      "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function showMessage(text, success = false) {
      message.style.display = "block";
      message.textContent = text;
      message.style.color = success ? "#86efac" : "#fca5a5";
      message.style.background = success ? "#12301f" : "#35151c";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document
        .getElementById("username").value.trim();

      const email = document
        .getElementById("email").value.trim();

      const password = document
        .getElementById("password").value;

      const confirmPassword = document
        .getElementById("confirmPassword").value;

      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        showMessage(
          "Username must be 3–20 characters using letters, numbers, or underscores."
        );
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must be at least 8 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.");
        return;
      }

      if (
        SUPABASE_URL === "https://rsrpxgmpcypyybzdidbj.supabase.co/rest/v1/" ||
        SUPABASE_PUBLISHABLE_KEY ===
          "sb_publishable_5RNJKNpdSEVibrtyrTwK0A_k3Zfid3O"
      ) {
        showMessage(
          "Supabase is not configured yet. Add your project URL and publishable key in this file."
        );
        return;
      }

      if (!window.supabase) {
        showMessage(
          "The Supabase library did not load. Check your internet connection and try again."
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              username: username
            },
            emailRedirectTo:
              "https://ajoks-payhub.pages.dev/login.html"
          }
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          showMessage(
            "Account created successfully! Opening your dashboard...",
            true
          );

          window.location.href = "dashboard.html";
          return;
        }

        showMessage(
          "Account created! Check your email for the confirmation link, then log in.",
          true
        );

      } catch (error) {
        console.error("Signup error:", error);

        showMessage(
          "Signup failed: " +
          (error.message || "Please try again.")
        );
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
