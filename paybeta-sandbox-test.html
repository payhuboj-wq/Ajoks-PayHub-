
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f1d">
  <title>Paybeta Data Sandbox Check | Ajoks PayHub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #080f1d;
      color: #eef2ff;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 560px;
      margin: 30px auto;
      padding: 24px;
      background: #111b2d;
      border: 1px solid #263650;
      border-radius: 18px;
    }
    h1 { font-size: 24px; }
    p { color: #c2cde0; line-height: 1.55; }
    select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 15px;
    }
    select {
      background: #070d18;
      color: white;
      border: 1px solid #40364e;
    }
    button {
      border: 0;
      background: #8b5cf6;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 14px;
      border-radius: 10px;
      background: #070d18;
      color: #dbeafe;
      min-height: 60px;
      font-size: 13px;
    }
    a { color: #d7c7ff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <h1>Paybeta Data Sandbox Check</h1>
  <p>This is a read-only test. It does not buy data, debit your wallet, or create an order.</p>

  <p id="session">Checking sign-in...</p>

  <label for="service">Choose network</label>
  <select id="service">
    <option value="mtn_data">MTN Data</option>
    <option value="airtel_data">Airtel Data</option>
    <option value="glo_data">Glo Data</option>
    <option value="9mobile_data">9mobile Data</option>
  </select>

  <button id="run" disabled>Check Data Bundles</button>
  <pre id="result" aria-live="polite">Waiting...</pre>

  <p>Your Paybeta API key remains on the server.</p>
  <a href="dashboard.html">← Back to dashboard</a>
</main>

<script>
  const client = window.supabase.createClient(
    "https://rsrpxgmpcypyybzdidbj.supabase.co",
    "sb_publishable_5RNJKNpdSEVibrtyrTwK0A_k3Zfid3O"
  );

  const sessionText = document.getElementById("session");
  const runButton = document.getElementById("run");
  const result = document.getElementById("result");

  async function checkSession() {
    const { data, error } = await client.auth.getSession();

    if (error || !data.session) {
      sessionText.textContent =
        "Please sign in to Ajoks PayHub in this browser first.";
      runButton.disabled = true;
      return;
    }

    sessionText.textContent = "Signed in. Ready for the sandbox check.";
    runButton.disabled = false;
  }

  runButton.addEventListener("click", async () => {
    runButton.disabled = true;
    result.textContent = "Requesting bundle information...";

    try {
      const service = document.getElementById("service").value;

      const { data, error } = await client.functions.invoke(
        "paybeta-data-sandbox-check",
        { body: { service } }
      );

      if (error) {
        let detail = error.message || "Request failed.";
        if (error.context && typeof error.context.json === "function") {
          try {
            const payload = await error.context.json();
            if (payload && payload.error) detail = payload.error;
          } catch (_) {}
        }
        result.textContent = "Test failed: " + detail;
      } else {
        result.textContent = JSON.stringify(data, null, 2);
      }
    } catch (_) {
      result.textContent =
        "Request failed. Check your connection and sign-in.";
    } finally {
      runButton.disabled = false;
    }
  });

  checkSession();
</script>
</body>
</html>
