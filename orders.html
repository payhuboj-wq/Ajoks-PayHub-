
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1d">
  <title>My Orders | Ajoks PayHub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-bottom: 100px;
      background: #080f1d;
      color: #f3f6fc;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 700px;
      margin: auto;
      padding: 24px 17px;
    }

    a {
      color: #a8c5ff;
      text-decoration: none;
    }

    h1 { margin-top: 28px; }

    .muted {
      color: #94a5bd;
      line-height: 1.6;
    }

    .summary {
      background: #2448b5;
      border-radius: 20px;
      padding: 24px;
      margin: 25px 0;
    }

    .summary p {
      margin: 0 0 10px;
      color: #d4e1ff;
    }

    .summary h2 {
      font-size: 32px;
      margin: 0;
    }

    .panel {
      background: #0e192a;
      border: 1px solid #20314e;
      border-radius: 20px;
      padding: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    select, input {
      min-width: 0;
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #30435f;
      background: #080f1d;
      color: white;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 30px 8px;
    }

    .empty-icon {
      font-size: 44px;
      color: #3475ff;
    }

    .empty h2 { font-size: 20px; }

    .button {
      display: block;
      text-align: center;
      background: #2864f0;
      color: white;
      padding: 14px;
      margin-top: 20px;
      border-radius: 12px;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      background: #0e192a;
      border-top: 1px solid #20314e;
      padding: 13px 4px calc(13px + env(safe-area-inset-bottom));
    }

    .nav-item {
      flex: 1;
      text-align: center;
      color: #65758e;
      font-size: 12px;
    }

    .nav-item span {
      display: block;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .nav-item.active { color: #3475ff; }

    @media (max-width: 360px) {
      .filters { flex-direction: column; }
    }
  </style>
</head>

<body>
  <main class="page">
    <a href="dashboard.html">← Back to Dashboard</a>

    <h1>My Orders</h1>
    <p class="muted">
      Track your service orders and check their status.
    </p>

    <section class="summary">
      <p>Total orders displayed</p>
      <h2 id="orderCount">0</h2>
    </section>

    <section class="panel">
      <div class="filters">
        <select id="statusFilter" aria-label="Filter orders by status">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
        </select>

        <input id="search" type="search"
          placeholder="Search order ID..."
          aria-label="Search order ID">
      </div>

      <div class="empty">
        <div class="empty-icon">▤</div>
        <h2 id="emptyTitle">No Orders Yet</h2>
        <p class="muted" id="emptyText">
          Your service orders will appear here after the order system
          is connected to your account.
        </p>
        <a class="button" href="dashboard.html">Explore Services</a>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <a class="nav-item active" href="dashboard.html">
      <span>⌂</span>Home
    </a>
    <a class="nav-item" href="buy-data.html">
      <span>▯</span>Numbers
    </a>
    <a class="nav-item" href="subscriptions.html">
      <span>↗</span>Boost
    </a>
    <a class="nav-item" href="fund-wallet.html">
      <span>▤</span>Wallet
    </a>
    <a class="nav-item" href="profile.html">
      <span>♙</span>Profile
    </a>
  </nav>

  <script>
    // Real customer orders will be loaded from the backend later.
    const orders = [];

    function renderOrders() {
      const status = document.getElementById("statusFilter").value;
      const search = document.getElementById("search")
        .value.trim().toLowerCase();

      const filtered = orders.filter(order => {
        const statusMatches =
          status === "all" || order.status === status;

        const searchMatches =
          (order.id || "").toLowerCase().includes(search);

        return statusMatches && searchMatches;
      });

      document.getElementById("orderCount").textContent =
        filtered.length;

      document.getElementById("emptyTitle").textContent =
        filtered.length ? "Orders Found" : "No Orders Yet";

      document.getElementById("emptyText").textContent =
        filtered.length
          ? "Your matching orders are available."
          : "No matching orders are available yet. Connect the secure backend to display real customer orders.";
    }

    document.getElementById("statusFilter")
      .addEventListener("change", renderOrders);

    document.getElementById("search")
      .addEventListener("input", renderOrders);

    renderOrders();
  </script>
</body>
</html>
