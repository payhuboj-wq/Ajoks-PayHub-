
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Ajoks PayHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #3988ff;
    }

    .card {
      background: #101e31;
      border: 1px solid #233650;
      border-radius: 16px;
      padding: 25px;
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
    }

    .subtitle {
      color: #a8b7ca;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #344963;
      border-radius: 9px;
      background: #091525;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #2878f0;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #142b43;
      border-radius: 8px;
      color: #b8d7ff;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    a {
      color: #62a5ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">Ajoks <span>PayHub</span></div>

    <section class="card">
      <h1>Reset Password</h1>

      <p class="subtitle">
        Enter the email address associated with your account.
        Password recovery will be available after authentication is connected.
      </p>

      <form id="resetForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >

        <button type="submit">Request Password Reset</button>
      </form>

      <div class="message" id="message" role="status"></div>

      <div class="links">
        <a href="login.html">← Back to Login</a>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("resetForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message");

      if (!email) {
        return;
      }

      message.textContent =
        "This page is not connected to password recovery yet. No reset email has been sent.";
      message.style.display = "block";
    });
  </script>
</body>
</html>
