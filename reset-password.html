
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f1d">
  <title>Reset Password | Ajoks PayHub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080f1d;
      color: #f3f6fc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      background: #0e192a;
      border: 1px solid #20314e;
      border-radius: 22px;
    }

    .logo {
      color: #75a1ff;
      font-size: 23px;
      font-weight: bold;
    }

    h1 { margin-top: 28px; }

    p {
      color: #94a5bd;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 22px 0 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #080f1d;
      border: 1px solid #30435f;
      border-radius: 10px;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #2864f0;
      color: white;
      border: none;
      border-radius: 11px;
      font-size: 16px;
      font-weight: bold;
    }

    .message {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #a8c5ff;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">AJOKS PAYHUB</div>

    <h1>Reset Your Password</h1>

    <p>
      Enter the email address associated with your account.
      If password recovery is enabled, you can request a reset link.
    </p>

    <form id="resetForm">
      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >

      <button type="submit">Request Reset Link</button>
    </form>

    <p id="message" class="message" role="status"></p>

    <a href="login.html">← Back to Login</a>
  </main>

  <script>
    document.getElementById("resetForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("message").textContent =
        "The reset request is not connected yet. Connect your authentication provider to send a real password-reset email.";
    });
  </script>
</body>
</html>
